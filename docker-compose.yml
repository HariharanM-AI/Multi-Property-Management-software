services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: propertyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propertyos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propertyos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propertyos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: propertyos-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/propertyos?schema=public}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "docker-dev-jwt-secret-propertyos-secure-key-32chars"
      COOKIE_SECRET: "docker-dev-session-cookie-secret-min32chars"
      ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: propertyos-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_NAME: "PropertyOS"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
